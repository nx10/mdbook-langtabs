version: 2
updates:
- package-ecosystem: "cargo"
  directory: "/"
  schedule:
    interval: "monthly"
  open-pull-requests-limit: 5
  labels:
  - "dependencies"
  - "rust"
  groups:
    patch-updates:
      patterns:
      - "*"
      update-types:
      - "patch"
    dev-dependencies:
      dependency-type: "development"
      update-types:
      - "minor"
      - "patch"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  open-pull-requests-limit: 3
  labels:
  - "dependencies"
  - "github-actions"
  groups:
    actions:
      patterns:
      - "*"
